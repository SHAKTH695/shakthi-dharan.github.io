<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    /* Make the certificates section scrollable */
    #certifications-container {
      display: flex;
      justify-content: center;
      align-content: flex-start;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    /* Custom scrollbar for Chrome/Edge */
    #certifications-container::-webkit-scrollbar {
      width: 8px;
    }
    #certifications-container::-webkit-scrollbar-thumb {
      background: #2e7d32;
      border-radius: 4px;
    }
    #certifications-container::-webkit-scrollbar-track {
      background: #e8f5e9;
    }

    .image-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 250px;
      height: 320px;
      padding: 15px;
      border-radius: 1rem;
      border: 2px solid #2e7d32;
      background-color: #e8f5e9;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .image-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.3);
    }

    .image-container img {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 0.5rem;
      border: 1px solid #c8e6c9;
      background: #fff;
    }

    .image-container p {
      font-size: 14px;
      font-weight: 500;
      color: #1b5e20;
      margin-top: 10px;
      line-height: 1.3;
      text-align: justify;
      max-width: 100%;
      height: 6rem;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    /* Responsive layout */
    @media (max-width: 1000px) {
      .image-container {
        width: calc(50% - 20px);
      }
    }

    @media (max-width: 600px) {
      #certifications-container {
        max-height: none;
      }
      .image-container {
        width: 100%;
        height: auto;
      }
      .image-container img {
        max-height: 160px;
      }
      .image-container p {
        height: auto;
        -webkit-line-clamp: unset;
      }
    }
  </style>
</head>
<body>

<div id="certifications-container"></div>

<script>
  const imageFolder = "./modules/certifications/images/";
  const jsonPath = "./modules/certifications/meta/certificates.json";

  const container = document.getElementById('certifications-container');

  fetch(jsonPath)
    .then(response => {
      if (!response.ok) throw new Error("Failed to load JSON");
      return response.json();
    })
    .then(certificates => {
      certificates.forEach(cert => {
        const imagePath = imageFolder + cert.file;

        const imageContainer = document.createElement('div');
        imageContainer.className = 'image-container';

        const img = document.createElement('img');
        img.src = imagePath;
        img.alt = cert.caption;

        const caption = document.createElement('p');
        caption.textContent = cert.caption;

        imageContainer.appendChild(img);
        imageContainer.appendChild(caption);
        container.appendChild(imageContainer);
      });
    })
    .catch(error => {
      console.error("Error loading certificates:", error);
    });
</script>

</body>
</html>
